<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pelvic ROM System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1.5rem; padding: 1rem; border-radius: 8px; border: 1px solid #ccc; }
    legend { font-weight: bold; }
    .form-group { margin-bottom: 0.8rem; display: flex; flex-direction: column; }
    .form-group label { margin-bottom: 0.3rem; font-weight: 500; }
    input, select, button { padding: 0.5rem; font-size: 1rem; border-radius: 4px; border: 1px solid #bbb; }
    button { cursor: pointer; background: #0066cc; color: white; border: none; margin-top: 0.5rem; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>

  <h1>Pelvic ROM System</h1>

  <!-- Patient Details Section -->
  <fieldset>
    <legend>Patient Details</legend>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Full Name" required />
    </div>

    <div class="form-group">
      <label for="gender">Gender:</label>
      <select id="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="age">Age:</label>
      <input type="number" id="age" min="0" max="120" placeholder="e.g. 35" />
    </div>

    <div class="form-group">
      <label for="date">Date:</label>
      <!-- Automatically populated with today's date -->
      <input type="date" id="date" readonly />
    </div>
  </fieldset>

  <!-- Device Connection Section -->
  <fieldset>
    <legend>Device Connection</legend>
    <p>Status: <span id="device-status" style="font-weight: bold; color: #cc0000;">Disconnected</span></p>
    <button type="button" id="connect-btn">Connect Device (Bluetooth)</button>
    <p>Current Reading: <span id="current-reading">--</span>°</p>
  </fieldset>

  <!-- Motion Stamp / ROM Capture Section -->
  <fieldset>
    <legend>Motion Recording</legend>
    <div class="form-group">
      <label for="motion-type">Motion Type:</label>
      <select id="motion-type">
        <option value="Anterior Tilt">Anterior Tilt</option>
        <option value="Posterior Tilt">Posterior Tilt</option>
        <option value="Lateral Tilt (Left)">Lateral Tilt (Left)</option>
        <option value="Lateral Tilt (Right)">Lateral Tilt (Right)</option>
        <option value="Rotation (Left)">Rotation (Left)</option>
        <option value="Rotation (Right)">Rotation (Right)</option>
      </select>
    </div>
    <button type="button" id="stamp-btn">Stamp Motion Reading</button>

    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Motion Type</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody id="stamped-records"></tbody>
    </table>
  </fieldset>

  <script>
    // 1. Auto-fill Date on Page Load
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
    });

    let currentAngle = 0; // Mock or live incoming sensor value

    // 2. Connect Device via Web Bluetooth API (or Web Serial API)
    document.getElementById('connect-btn').addEventListener('click', async () => {
      try {
        if (!navigator.bluetooth) {
          alert('Web Bluetooth is not supported on this browser. Try Chrome on Android, Windows, or Mac.');
          return;
        }

        // Request BLE device (update service UUID to match your IMU / sensor module, e.g. MPU6050, BNO055)
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['battery_service'] // Replace with your sensor's custom service UUID
        });

        const statusEl = document.getElementById('device-status');
        statusEl.textContent = `Connected to ${device.name || 'Sensor'}`;
        statusEl.style.color = '#008800';

        // Example simulation of data feed if hardware characteristic is not yet wired:
        setInterval(() => {
          currentAngle = (Math.sin(Date.now() / 1000) * 30 + 15).toFixed(1);
          document.getElementById('current-reading').textContent = currentAngle;
        }, 100);

      } catch (err) {
        console.error('Connection failed:', err);
        alert('Could not connect: ' + err.message);
      }
    });

    // 3. Stamp Motion
    document.getElementById('stamp-btn').addEventListener('click', () => {
      const patientName = document.getElementById('name').value;
      if (!patientName) {
        alert('Please enter patient name before recording motion.');
        return;
      }

      const motionType = document.getElementById('motion-type').value;
      const timeStamp = new Date().toLocaleTimeString();
      const recordTable = document.getElementById('stamped-records');

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${timeStamp}</td>
        <td>${motionType}</td>
        <td><strong>${currentAngle}°</strong></td>
      `;
      recordTable.prepend(row);
    });
  </script>
</body>
</html>
